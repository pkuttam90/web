<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloudant 5Hz Live Feed</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        #data-container { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-family: monospace;
        }
        .status { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Cloudant Live Monitor <small>(5 Hz)</small></h2>
    <p>Status: <span id="status" class="status">Polling...</span></p>
    
    <div id="data-container">
        Waiting for data...
    </div>

    <script>
 // --- CONFIGURATION ---
const DB_URL = "https://YOUR_ACCOUNT.cloudant.com/YOUR_DATABASE";
const API_KEY = "your_api_key";
const PASSWORD = "your_password";

const headers = new Headers();
headers.set('Authorization', 'Basic ' + btoa(API_KEY + ":" + PASSWORD));

// We track the 'last_seq' so we only get updates that happened AFTER our last check
let lastSequence = "now"; 

async function watchChanges() {
    // feed=longpoll tells Cloudant to keep the connection open
    // heartbeat=15000 keeps the connection alive
    const url = `${DB_URL}/_changes?feed=longpoll&include_docs=true&since=${lastSequence}&heartbeat=15000`;

    try {
        const response = await fetch(url, { method: 'GET', headers: headers });
        const data = await response.json();

        if (data.results && data.results.length > 0) {
            // Update the UI with the most recent change
            const latestDoc = data.results[data.results.length - 1].doc;
            document.getElementById('data-container').innerText = JSON.stringify(latestDoc, null, 2);
            
            // Update our sequence pointer so we don't fetch the same data twice
            lastSequence = data.last_seq;
        }

        // Immediately re-connect to wait for the next update
        watchChanges();

    } catch (error) {
        console.error("Connection lost, retrying in 3 seconds...", error);
        setTimeout(watchChanges, 3000); // Retry after a delay if the server is down
    }
}

// Start the listener
watchChanges();    </script>
</body>
</html>
